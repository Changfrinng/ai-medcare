<title>AI-MedCare 藥物辨識</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="AI 智慧藥物影像辨識暨用藥衛教系統（原型）— 開發者：CY團隊">
<meta name="theme-color" content="#5b2a86">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky app bar + bottom tab bar on phones / side rail on tablets & desktop; content as working panels */
:root{
  --bg:#f4f0fa; --surface:#fcfaff; --surface-2:#ebe3f6; --line:#d8cbe9;
  --fg:#221a2e; --muted:#5f526f; --accent:#5b2a86; --accent-fg:#ffffff; --accent-soft:#e6d9f5;
  --warn:#9a5b00; --warn-soft:#fff1d6; --danger:#b42318; --danger-soft:#fde4e1; --ok:#1d6b35; --ok-soft:#dcf2e2;
  --pill-shadow:0 1px 0 rgba(0,0,0,.06);
  --font:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --fs:16px; --radius:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#140f1c; --surface:#1c1527; --surface-2:#251c33; --line:#3a2d4d;
  --fg:#ece6f4; --muted:#b2a5c4; --accent:#c4a0f0; --accent-fg:#1d0f30; --accent-soft:#33224a;
  --warn:#f2b95a; --warn-soft:#3a2a0c; --danger:#ff8a7d; --danger-soft:#431713; --ok:#7fd69a; --ok-soft:#123321; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#140f1c; --surface:#1c1527; --surface-2:#251c33; --line:#3a2d4d;
  --fg:#ece6f4; --muted:#b2a5c4; --accent:#c4a0f0; --accent-fg:#1d0f30; --accent-soft:#33224a;
  --warn:#f2b95a; --warn-soft:#3a2a0c; --danger:#ff8a7d; --danger-soft:#431713; --ok:#7fd69a; --ok-soft:#123321; color-scheme:dark}
:root.hc{ --bg:#000; --surface:#000; --surface-2:#111; --line:#fff; --fg:#fff; --muted:#fff; --accent:#ffd400; --accent-fg:#000; --accent-soft:#222;
  --warn:#ffd400; --warn-soft:#000; --danger:#ff6b6b; --danger-soft:#000; --ok:#7CFF8A; --ok-soft:#000; color-scheme:dark}
:root.big{ --fs:20px }
html{font-size:var(--fs)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1rem;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--accent)}
h1,h2,h3{line-height:1.3;text-wrap:balance;margin:0}
h2{font-size:1.35rem;font-weight:900}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* App bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--accent);color:var(--accent-fg)}
.bar-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px}
.logo>div{min-width:0}
.logo b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:600px){.logo span{display:none}.bar-in{gap:8px}}
.logo svg{flex:none}
.logo b{font-weight:900;font-size:1.05rem;letter-spacing:.02em;display:block;line-height:1.2}
.logo span{font-size:.75rem;opacity:.85;display:block}
.team{font-size:.72rem;font-weight:700;letter-spacing:.06em;border:1px solid currentColor;border-radius:999px;padding:2px 10px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid currentColor;border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 12px;cursor:pointer;font-size:.85rem;color:inherit}
.seg button[aria-pressed="true"]{background:var(--accent-fg);color:var(--accent);font-weight:700}
.iconbtn{background:none;border:1px solid currentColor;border-radius:999px;padding:4px 10px;cursor:pointer;color:inherit;font-size:.85rem}

/* Shell */
.shell{display:grid;grid-template-columns:1fr;min-height:calc(100% - 60px)}
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;overflow-x:auto;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs a{flex:1 0 auto;min-width:68px;text-decoration:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;font-size:.72rem;font-weight:500}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent);font-weight:700}
main{padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
@media (min-width:900px){
  .shell{grid-template-columns:220px 1fr}
  nav.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);height:calc(100vh - 60px);flex-direction:column;border-top:0;border-right:1px solid var(--line);overflow:auto;padding-block:16px;padding-left:max(8px,env(safe-area-inset-left,0px))}
  nav.tabs a{flex:none;flex-direction:row;gap:10px;font-size:.95rem;padding:10px 14px;border-radius:10px;margin:0 8px}
  nav.tabs a[aria-current="page"]{background:var(--accent-soft)}
  main{padding-bottom:40px}
}

/* Components */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;text-decoration:none;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{min-height:34px;padding:4px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:500;min-width:0}
input[type=text],input[type=number],input[type=time],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px;width:100%;box-sizing:border-box}
textarea{min-height:90px;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;background:var(--surface-2);color:var(--fg);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.alert{border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;border:1px solid}
.alert.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--fg)}
.alert.danger{background:var(--danger-soft);border-color:var(--danger);color:var(--fg)}
.alert.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--fg)}
.alert.info{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.alert b.t{display:block}
.sev{width:6px;align-self:stretch;border-radius:3px;flex:none}
.sev.major{background:var(--danger)} .sev.moderate{background:var(--warn)} .sev.minor{background:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--muted);font-size:.8rem;letter-spacing:.04em}
.tw{overflow-x:auto}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:6px 12px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.hero{display:grid;gap:16px;grid-template-columns:1fr;align-items:center}
@media (min-width:720px){.hero{grid-template-columns:1.3fr 1fr}}
.hero h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:900;letter-spacing:.01em}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.12em;color:var(--accent)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:1.6rem;font-variant-numeric:tabular-nums}
.drop{border:2px dashed var(--line);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:var(--surface-2);min-height:200px}
.drop.over{border-color:var(--accent)}
.preview{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.preview canvas{width:100%;max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
.steps{display:flex;gap:6px;flex-wrap:wrap;counter-reset:s}
.steps li{list-style:none;counter-increment:s;font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.steps li::before{content:counter(s) ". "}
.steps li.on{background:var(--accent);color:var(--accent-fg);font-weight:700}
.steps li.done{background:var(--accent-soft);color:var(--accent)}
.cand{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
@media (max-width:560px){.cand{grid-template-columns:56px 1fr}.cand>:last-child{grid-column:1/-1;flex-direction:row!important;align-items:center!important;justify-content:space-between}}
.preview canvas{max-height:240px;object-fit:contain}
.cand.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pill{width:56px;height:56px;display:block}
.bar-meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;width:110px}
.bar-meter i{display:block;height:100%;background:var(--accent)}
.edu{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.edu section{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.edu section h4{margin:0;font-size:.95rem;display:flex;gap:8px;align-items:baseline}
.edu section h4 small{font-family:var(--mono);color:var(--accent);font-size:.8rem}
.edu ul{margin:0;padding-left:1.2em}
.pro{border-left:4px solid var(--accent)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow:auto;padding:4px}
.msg{max-width:86%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg .src{display:block;margin-top:6px;font-size:.75rem;color:var(--muted)}
.msg.a.urgent{background:var(--danger-soft);border:1px solid var(--danger)}
.qs{display:flex;gap:6px;flex-wrap:wrap}
.qs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.85rem}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.check input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--accent)}
footer.ft{border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.8rem;color:var(--muted)}
.only-pro{display:none} :root.pro-mode .only-pro{display:revert} :root.pro-mode .only-pro.flexy{display:flex}
.lock{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-size:.9rem;max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:24px}}
.lang-card{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.flow{display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.flow div{padding:8px 12px;border-radius:8px;background:var(--surface-2)}
.flow div.key{background:var(--warn-soft);border:1px solid var(--warn);font-weight:700}
@media (prefers-reduced-motion:no-preference){.panel{animation:in .25s ease both}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

<header class="bar">
  <div class="bar-in">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="3" y="11" width="28" height="12" rx="6" fill="none" stroke="currentColor" stroke-width="2.4" transform="rotate(-35 17 17)"/><line x1="17" y1="6" x2="17" y2="28" stroke="currentColor" stroke-width="2.4" transform="rotate(-35 17 17)"/><circle cx="26" cy="26" r="5" fill="currentColor"/></svg>
      <div><b>AI-MedCare 智慧藥物辨識</b><span>藥物影像辨識暨用藥衛教系統</span></div>
    </div>
    <span class="team" title="系統開發者">開發者・CY團隊</span>
    <div class="seg" role="group" aria-label="使用版本">
      <button id="m-public" aria-pressed="true">一般民眾版</button>
      <button id="m-pro" aria-pressed="false">醫護專業版</button>
    </div>
    <button class="iconbtn" id="t-big" aria-pressed="false" title="大字體模式">大字</button>
    <button class="iconbtn" id="t-hc" aria-pressed="false" title="高對比模式">高對比</button>
  </div>
</header>

<div class="shell">
  <nav class="tabs" aria-label="主選單" id="tabs"></nav>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const DB = /*__DRUGS__*/;
const DRUGS = DB.drugs;
const byId = Object.fromEntries(DRUGS.map(d=>[d.id,d]));
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- storage (safe) ---------- */
const store={get(k,d){try{const v=localStorage.getItem("aimc:"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("aimc:"+k,JSON.stringify(v))}catch(e){}}};
const state={
  mode:store.get("mode","public"),
  big:store.get("big",false), hc:store.get("hc",false),
  meds:store.get("meds",[
    {id:"amlodipine",dose:"1 顆",times:["08:00"],example:true},
    {id:"simvastatin",dose:"1 顆",times:["21:00"],example:true},
    {id:"aspirin",dose:"1 顆",times:["08:00"],example:true}
  ]),
  profile:store.get("profile",{allergy:[],pregnant:false,lactation:false,elderly:true,child:false,renal:false,hepatic:false}),
  taken:store.get("taken",{}),
  eduLog:store.get("eduLog",[]),
  scan:null, selected:null, confirmed:false,
  chat:[], chatDrug:null
};
function save(){store.set("mode",state.mode);store.set("big",state.big);store.set("hc",state.hc);store.set("meds",state.meds);store.set("profile",state.profile);store.set("taken",state.taken);store.set("eduLog",state.eduLog)}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2600)}

/* ---------- vocab ---------- */
const COLORS={white:"白色",yellow:"黃色",orange:"橘色",pink:"粉紅色",red:"紅色",brown:"棕色",green:"綠色",blue:"藍色",purple:"紫色",grey:"灰色",black:"黑色"};
const SWATCH={white:"#f7f7f2",yellow:"#f4d03f",orange:"#f0a35e",pink:"#f2a7b8",red:"#d64541",brown:"#8d6748",green:"#6fbf73",blue:"#5b8fd9",purple:"#9b72cf",grey:"#a0a4a8",black:"#333"};
const SHAPES={round:"圓形",oval:"橢圓形",oblong:"長橢圓形",capsule:"膠囊形",other:"其他"};
const FORMS={tablet:"錠劑",capsule:"膠囊",other:"其他（藥水、外用等）"};
const LEVEL={major:["嚴重","danger"],moderate:["中度","warn"],minor:["輕度",""]};

function pillSVG(d,size=56){
  const c1=SWATCH[d.color[0]]||"#ddd", c2=SWATCH[d.color[1]||d.color[0]]||c1;
  const stroke="rgba(0,0,0,.25)";
  let shape;
  if(d.shape==="capsule"||d.form==="capsule") shape=`<clipPath id="cl${d.id}"><rect x="6" y="18" width="44" height="20" rx="10"/></clipPath><g clip-path="url(#cl${d.id})"><rect x="6" y="18" width="22" height="20" fill="${c1}"/><rect x="28" y="18" width="22" height="20" fill="${c2}"/></g><rect x="6" y="18" width="44" height="20" rx="10" fill="none" stroke="${stroke}"/>`;
  else if(d.shape==="round") shape=`<circle cx="28" cy="28" r="19" fill="${c1}" stroke="${stroke}"/>${d.score?`<line x1="13" y1="28" x2="43" y2="28" stroke="${stroke}"/>`:""}`;
  else if(d.shape==="oval") shape=`<ellipse cx="28" cy="28" rx="23" ry="15" fill="${c1}" stroke="${stroke}"/>${d.score?`<line x1="28" y1="14" x2="28" y2="42" stroke="${stroke}"/>`:""}`;
  else shape=`<rect x="4" y="17" width="48" height="22" rx="11" fill="${c1}" stroke="${stroke}"/>${d.score?`<line x1="28" y1="17" x2="28" y2="39" stroke="${stroke}"/>`:""}`;
  return `<svg class="pill" width="${size}" height="${size}" viewBox="0 0 56 56" role="img" aria-label="${esc(d.zh)} 外觀示意">${shape}<text x="28" y="${d.shape==="round"?33:31}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="7" font-weight="600" fill="rgba(0,0,0,.55)">${esc(d.imprint)}</text></svg>`;
}

/* ---------- navigation ---------- */
const ICON={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2"/>',
 scan:'<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/>',
 drugs:'<rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2"/>',
 assistant:'<path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 10h8" stroke="currentColor" stroke-width="2"/>',
 mymeds:'<path d="M12 3v4M12 21v-4M4 12h4M20 12h-4" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/>',
 nurse:'<path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="3"/>',
 lang:'<path d="M4 5h9M8.5 3v2M6 5c0 4 3 7 6 8M11 5c0 4-3 7-6 8M13 21l4-10 4 10M14.5 17h5" fill="none" stroke="currentColor" stroke-width="2"/>',
 about:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7v.5" stroke="currentColor" stroke-width="2.4"/>'
};
const VIEWS=[["home","首頁"],["scan","影像辨識"],["drugs","藥品資料庫"],["assistant","衛教助理"],["mymeds","我的用藥"],["nurse","給藥核對"],["lang","多語言"],["about","關於"]];
function renderTabs(){
  const cur=route();
  $("#tabs").innerHTML=VIEWS.filter(([k])=>k!=="nurse"||state.mode==="pro").map(([k,t])=>`<a href="#${k}" ${k===cur?'aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>${t}</a>`).join("");
}
function route(){const h=(location.hash||"#home").slice(1).split("-")[0];return VIEWS.some(v=>v[0]===h)?h:"home"}
function go(v){if(location.hash==="#"+v)render();else location.hash=v}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});

function applyPrefs(){
  const r=document.documentElement;
  r.classList.toggle("pro-mode",state.mode==="pro");
  r.classList.toggle("big",state.big); r.classList.toggle("hc",state.hc);
  $("#m-public").setAttribute("aria-pressed",state.mode==="public");

function speak(text,lang="zh-TW"){
  try{ if(!("speechSynthesis" in window)){toast("此瀏覽器不支援語音朗讀");return}
    speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=.92;
    const v=speechSynthesis.getVoices().find(v=>v.lang.replace("_","-").toLowerCase().startsWith(lang.toLowerCase().slice(0,2)));
    if(v)u.voice=v; speechSynthesis.speak(u);
  }catch(e){toast("語音朗讀無法使用")}
}

/* ---------- safety engine ---------- */
function interactionsFor(ids){
  const out=[];
  for(const it of DB.interactions){ if(ids.includes(it.a)&&ids.includes(it.b)) out.push(it) }
  const ord={major:0,moderate:1,minor:2}; return out.sort((x,y)=>ord[x.level]-ord[y.level]);
}
function safetyCheck(ids,profile){
  const alerts=[];
  interactionsFor(ids).forEach(it=>alerts.push({level:it.level,title:`交互作用：${byId[it.a].zh} ＋ ${byId[it.b].zh}`,text:it.note}));
  // duplicates (exclude intentional antiplatelet+aspirin counted already)
  for(const [g,label] of Object.entries(DB.duplicateGroups)){
    const hit=ids.filter(id=>byId[id].groups.includes(g));
    if(hit.length>1 && g!=="antihypertensive" && !(g==="nsaid"&&interactionsFor(hit).length)) alerts.push({level:"moderate",title:`重複用藥：${label}`,text:`${hit.map(i=>byId[i].zh).join("、")} 屬同類藥物，請與醫師或藥師確認是否重複。`});
    if(g==="antihypertensive"&&hit.length>1) alerts.push({level:"minor",title:"併用多種降血壓藥",text:`${hit.map(i=>byId[i].zh).join("、")}：常為醫師刻意合併處方，請留意頭暈、姿勢性低血壓。`});
  }
  (profile.allergy||[]).forEach(g=>{ids.filter(id=>byId[id].groups.includes(g)).forEach(id=>alerts.push({level:"major",title:`過敏警示：${byId[id].zh}`,text:`您記錄對「${DB.allergyGroups[g]}」過敏，此藥屬於該類，請勿服用並立即與醫師、藥師確認。`}))});
  ids.forEach(id=>{const d=byId[id];
    if(profile.pregnant)alerts.push({level:/禁用|避免|不建議/.test(d.special.pregnancy)?"major":"minor",title:`孕期：${d.zh}`,text:d.special.pregnancy});
    if(profile.lactation)alerts.push({level:"minor",title:`哺乳：${d.zh}`,text:d.special.lactation});
    if(profile.elderly)alerts.push({level:"minor",title:`高齡者：${d.zh}`,text:d.special.elderly});
    if(profile.child)alerts.push({level:/避免/.test(d.special.child)?"major":"minor",title:`兒童：${d.zh}`,text:d.special.child});
    if(profile.renal&&!/無需/.test(d.renal))alerts.push({level:/禁用|避免/.test(d.renal)?"major":"moderate",title:`腎功能：${d.zh}`,text:d.renal});
    if(profile.hepatic&&!/無需/.test(d.hepatic))alerts.push({level:/禁用|避免/.test(d.hepatic)?"major":"moderate",title:`肝功能：${d.zh}`,text:d.hepatic});
    if(d.highAlert)alerts.push({level:"moderate",title:`高警訊藥物：${d.zh}`,text:"治療範圍窄或出血風險高，請嚴格依醫囑服用並定期追蹤。"});
  });
  const ord={major:0,moderate:1,minor:2}; return alerts.sort((a,b)=>ord[a.level]-ord[b.level]);
}
function alertHTML(a){const [t,c]=LEVEL[a.level];return `<div class="alert ${c||"info"}"><span class="sev ${a.level}"></span><div><b class="t">${esc(a.title)} <span class="chip ${c}">${t}</span></b><span class="small">${esc(a.text)}</span></div></div>`}

/* ---------- image analysis (client-side feature extraction) ---------- */
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s,l]}
function nameColor(r,g,b){const[h,s,l]=rgb2hsl(r,g,b);
  if(l>.82&&s<.35)return"white"; if(l<.18)return"black"; if(s<.15)return l>.6?"white":"grey";
  if(h<12||h>=345)return l>.65?"pink":"red"; if(h<40)return l<.38?"brown":(l>.72?"pink":"orange"); if(h<68)return"yellow";
  if(h<165)return"green"; if(h<255)return"blue"; if(h<300)return"purple"; return"pink"}
function analyzeImage(img){
  const W=220,scale=Math.min(1,W/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;const cx=cv.getContext("2d",{willReadFrequently:true});cx.drawImage(img,0,0,w,h);
  const data=cx.getImageData(0,0,w,h).data;
  // background = median-ish average of border pixels
  let br=0,bg=0,bb=0,n=0;const px=(x,y)=>{const i=(y*w+x)*4;return[data[i],data[i+1],data[i+2]]};
  for(let x=0;x<w;x++){for(const y of[0,1,h-2,h-1]){const p=px(x,Math.max(0,y));br+=p[0];bg+=p[1];bb+=p[2];n++}}
  for(let y=0;y<h;y++){for(const x of[0,1,w-2,w-1]){const p=px(Math.max(0,x),y);br+=p[0];bg+=p[1];bb+=p[2];n++}}
  br/=n;bg/=n;bb/=n;
  const mask=new Uint8Array(w*h);let minx=w,miny=h,maxx=0,maxy=0,area=0;const fg=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;const d=Math.hypot(data[i]-br,data[i+1]-bg,data[i+2]-bb);
    if(d>42){mask[y*w+x]=1;area++;if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;if((x+y)%2===0)fg.push([data[i],data[i+1],data[i+2]])}}
  const res={w,h,bg:[br,bg,bb].map(Math.round),area,quality:[]};
  if(area<w*h*0.01||fg.length<20){res.ok=false;res.quality.push("未能偵測到藥物主體：請將藥物放在單色背景（深色背景較佳）並置中拍攝。");return{res,cv}}
  res.ok=true;
  const bw=maxx-minx+1,bh=maxy-miny+1,ar=Math.max(bw,bh)/Math.min(bw,bh),fill=area/(bw*bh);
  // 2-cluster k-means on fg colors for two-tone capsules
  // k-means (k=3: two possible capsule halves + shadow/imprint noise), farthest-point init
  const dist=(p,c)=>Math.hypot(p[0]-c[0],p[1]-c[1],p[2]-c[2]);
  const mean=[0,1,2].map(k=>fg.reduce((s,p)=>s+p[k],0)/fg.length);
  const far=(refs)=>fg.reduce((best,p)=>{const d=Math.min(...refs.map(r=>dist(p,r)));return d>best[0]?[d,p]:best},[-1,fg[0]])[1].slice();
  const cs=[mean];cs.push(far(cs));cs.push(far(cs));
  let counts=[0,0,0];
  for(let it=0;it<10;it++){const acc=cs.map(()=>[0,0,0,0]);for(const p of fg){let bi=0,bd=1e9;cs.forEach((c,i)=>{const d=dist(p,c);if(d<bd){bd=d;bi=i}});const t=acc[bi];t[0]+=p[0];t[1]+=p[1];t[2]+=p[2];t[3]++}
    acc.forEach((t,i)=>{if(t[3])cs[i]=[t[0]/t[3],t[1]/t[3],t[2]/t[3]]});counts=acc.map(t=>t[3])}
  const clusters=cs.map((c,i)=>({name:nameColor(...c),share:counts[i]/fg.length})).filter(c=>c.share>.18).sort((a,b)=>b.share-a.share);
  const names=[];for(const c of clusters)if(!names.includes(c.name))names.push(c.name);
  res.split=counts;
  let cols=names.filter(n=>n!=="black"||names.length===1);
  if(cols.includes("white")&&cols.includes("grey"))cols=cols.filter(n=>n!=="grey"); // shading on white tablets
  res.colors=cols.slice(0,2).length?cols.slice(0,2):[nameColor(...mean)];
  res.shape=ar<1.18?"round":ar<1.65?"oval":(res.colors.length>1?"capsule":"oblong");
  if(res.colors.length>1&&ar>=1.65)res.form="capsule";else res.form="tablet";
  res.metrics={aspect:+ar.toFixed(2),fill:+fill.toFixed(2),box:[minx,miny,bw,bh]};
  // quality: blur via Laplacian variance on luminance
  let s=0,s2=0,c=0;for(let y=1;y<h-1;y+=2)for(let x=1;x<w-1;x+=2){const L=(xx,yy)=>{const i=(yy*w+xx)*4;return .299*data[i]+.587*data[i+1]+.114*data[i+2]};const v=4*L(x,y)-L(x-1,y)-L(x+1,y)-L(x,y-1)-L(x,y+1);s+=v;s2+=v*v;c++}
  const lapVar=s2/c-(s/c)**2;res.metrics.sharp=Math.round(lapVar);
  if(lapVar<18)res.quality.push("影像可能模糊，建議對焦後重拍。");
  if(area/(w*h)>.85)res.quality.push("藥物佔滿畫面或背景與藥物顏色相近，偵測可能不準。");
  if(Math.min(bw,bh)<18)res.quality.push("藥物在畫面中過小，請靠近一點拍攝。");
  // draw overlay
  cx.strokeStyle="#7b3fb3";cx.lineWidth=2;cx.setLineDash([4,3]);cx.strokeRect(minx-2,miny-2,bw+4,bh+4);
  return{res,cv};
}
function matchDrugs(f){
  const imp=(f.imprint||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  return DRUGS.map(d=>{
    let s=0,why=[];
    const dc=d.color, fc=f.colors||[];
    const colorHit=fc.filter(c=>dc.includes(c)).length; const cs=fc.length?colorHit/Math.max(fc.length,dc.length):0;
    s+=35*cs; if(cs>0)why.push("顏色");
    const near={round:["oval"],oval:["round","oblong"],oblong:["oval","capsule"],capsule:["oblong"]};
    if(f.shape===d.shape){s+=25;why.push("形狀")}else if((near[f.shape]||[]).includes(d.shape))s+=10;
    if(f.form===d.form){s+=10}
    if(imp){const di=d.imprint.toUpperCase();
      if(di===imp){s+=30;why.push("刻痕完全相符")}
      else{let common=0;for(let i=0;i<Math.min(di.length,imp.length);i++)if(di[i]===imp[i])common++;
        const r=common/Math.max(di.length,imp.length); if(r>=.5){s+=30*r*.7;why.push("刻痕部分相符")} else if(di.includes(imp)||imp.includes(di)){s+=15;why.push("刻痕部分相符")}}}
    const max=imp?100:70;
    return {d,score:Math.round(s/max*100),why};
  }).sort((a,b)=>b.score-a.score);
}

  c.restore();

}

/* ---------- RAG-style assistant ---------- */
const INTENTS=[
  ["urgent",/胸痛|胸悶|呼吸困難|喘不過氣|昏倒|昏厥|意識|吃太多|過量|誤食|嘴唇腫|臉腫|抽搐/],
  ["double",/兩顆|2顆|二顆|兩倍|加倍|多吃一顆|補兩/],
  ["missed",/忘記|漏吃|漏服|沒吃|忘了/],
  ["dizzy",/頭暈|暈/],
  ["serious",/嚴重|就醫|危險|黑便|出血|流血/],
  ["side",/副作用|不舒服|不適|反應/],
  ["timing",/什麼時候|何時|飯前|飯後|睡前|早上|晚上|時間/],
  ["food",/葡萄柚|食物|喝酒|酒|咖啡|牛奶|茶|蔬菜|保健|中藥|飲食|吃什麼/],
  ["interact",/一起吃|併用|交互|同時|一起服/],
  ["preg",/懷孕|孕婦|哺乳|餵奶/],
  ["storage",/保存|冰箱|放哪|過期/],
  ["use",/做什麼|用途|治療什麼|什麼藥|功用|為什麼/],
  ["how",/怎麼吃|怎麼服|剝半|磨粉|咬碎|吞/],
  ["mech",/機轉|原理|怎麼作用/]
];
function findDrugs(t){const T=t.toLowerCase();return DRUGS.filter(d=>[d.zh.replace(/（.*）/,""),d.en.split(" ")[0],...d.brand.split(/[ 、等（）]/).filter(x=>x.length>1)].some(k=>k&&T.includes(k.toLowerCase())))}
function answer(text){
  const intents=INTENTS.filter(([k,re])=>re.test(text)).map(x=>x[0]);
  let ds=findDrugs(text);
  if(!ds.length&&state.chatDrug)ds=[byId[state.chatDrug]];
  if(ds.length)state.chatDrug=ds[0].id;
  const src=ds.length?`資料來源：${ds.map(d=>d.zh+"衛教資料").join("、")}（示範知識庫，未經藥師審核）`:"資料來源：AI-MedCare 一般用藥安全原則";
  if(intents.includes("urgent"))return{urgent:true,text:"這可能是需要立即處理的狀況。\n請立即撥打 119 或前往最近的急診，並攜帶藥袋與藥物。\n在等待時請坐下或躺下，不要開車。",src:"資料來源：用藥安全緊急處置原則"};
  const out=[];
  if(intents.includes("double"))out.push("不建議自行加倍服藥。"+(ds.length?`${ds[0].zh}的處理方式：${ds[0].missed}`:"不同藥物的補服方式不同，請提供藥袋上的藥品名稱及原本的服藥時間，並向藥師確認。"));
  if(intents.includes("dizzy"))out.push("請先坐下或躺下，避免跌倒。若可以，請測量血壓並聯絡醫療人員。若出現昏厥、胸痛或呼吸困難，請立即就醫。"+(ds.length&&ds[0].common.some(c=>/暈/.test(c))?`\n頭暈是${ds[0].zh}的常見副作用之一，請回診時告訴醫師。`:""));
  if(!ds.length){
    if(!out.length)out.push("我需要知道是哪一種藥，才能根據審核過的資料回答。請輸入藥袋上的藥名（例如「華法林」或「Amlodipine」），或先到「影像辨識」確認藥物。");
    return{text:out.join("\n\n"),src};
  }
  const d=ds[0];
  const map={missed:`忘記服用${d.zh}：${d.missed}`,serious:`${d.zh}需要立即就醫的警訊：\n・${d.serious.join("\n・")}`,side:`${d.zh}常見副作用：${d.common.join("、")}。\n若出現以下情形請立即就醫：\n・${d.serious.join("\n・")}`,timing:`${d.zh}的服藥時間：${d.timing}`,food:`${d.zh}的飲食注意：${d.food}`,preg:`${d.zh}孕期：${d.special.pregnancy}\n哺乳：${d.special.lactation}`,storage:`${d.zh}保存方式：${d.storage}`,use:`${d.zh}的用途：${d.use}`,how:`${d.zh}的使用方式：${d.howto}`,mech:`${d.zh}的作用機轉：${d.mechanism}`};
  for(const k of intents){ if(k==="interact"){const ids=[...new Set(ds.map(x=>x.id).concat(state.meds.map(m=>m.id)))];const named=ds.map(x=>x.id);const it=named.length>1?interactionsFor(named):interactionsFor(ids).filter(i=>named.includes(i.a)||named.includes(i.b));out.push(it.length?it.map(i=>`【${LEVEL[i.level][0]}】${byId[i.a].zh} ＋ ${byId[i.b].zh}：${i.note}`).join("\n"):`在資料庫中未找到${ds.map(x=>x.zh).join("與")}和您用藥清單之間的已知交互作用。仍請告訴藥師您正在使用的所有藥物與保健食品。`)}
    else if(map[k]&&!(k==="missed"&&intents.includes("double")))out.push(map[k]); }
  if(!out.length)out.push(`${d.zh}（${d.en}）：${d.use}\n服藥時間：${d.timing}\n您可以問我：副作用、忘記服藥、食物、併用其他藥物、懷孕、保存方式。`);
  return{text:out.join("\n\n"),src};
}

let camStream=null;

async function startCam(){
  const msg=$("#camMsg");
  const embedded=(()=>{try{return window.top!==window.self}catch(e){return true}})();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.isSecureContext){
    msg.innerHTML='<div class="alert warn"><span class="sev moderate"></span><span>此網址不是安全連線（HTTPS），瀏覽器不允許開啟相機。請改用 HTTPS 網址開啟本系統，或按「手機相機 App」拍照。</span></div>';return}
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});
    const v=$("#camVideo");v.srcObject=camStream;await v.play().catch(()=>{});
    $("#camBox").hidden=false;$("#camIdle").hidden=true;
  }catch(err){
    stopCam();
    const denied=err&&(err.name==="NotAllowedError"||err.name==="SecurityError");
    msg.innerHTML=`<div class="alert warn"><span class="sev moderate"></span><span>${denied?(embedded?"目前是在預覽視窗中開啟，預覽平台不允許網頁使用相機。請按「手機相機 App」拍照，或用正式網址（HTTPS）開啟本系統即可直接拍照。":"相機權限被拒絕。請到瀏覽器網址列旁的權限設定允許相機，再按一次。"):(err&&err.name==="NotFoundError"?"找不到可用的相機。":"無法開啟相機，請改按「手機相機 App」或「從相簿選擇」。")}</span></div>`;
  }
}
function shootCam(){const v=$("#camVideo");if(!v.videoWidth){toast("相機尚未就緒");return}
  const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);
  stopCam();const img=new Image();img.onload=()=>handleImage(img);img.src=c.toDataURL("image/jpeg",.92)}

function handleImage(img){
  const {res,cv}=analyzeImage(img);
  const o=document.createElement("canvas");const s=Math.min(1,360/Math.max(img.width,img.height));o.width=Math.round(img.width*s);o.height=Math.round(img.height*s);o.getContext("2d").drawImage(img,0,0,o.width,o.height);
  const feat=res.ok?{colors:res.colors,shape:res.shape,form:res.form,imprint:""}:{colors:["white"],shape:"round",form:"tablet",imprint:""};
  state.scan={orig:o,proc:cv,res,feat};state.selected=null;state.confirmed=false;render();
  setTimeout(()=>$("#featPanel")?.scrollIntoView({behavior:"smooth",block:"start"}),50);
}

  if(t.classList.contains("n5")||t.id==="n-dbl"){}
});
document.addEventListener("dragover",e=>{const d=e.target.closest?.("#drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("drop",e=>{const d=e.target.closest?.("#drop");if(d){e.preventDefault();const f=e.dataTransfer.files[0];if(f){const img=new Image();img.onload=()=>handleImage(img);img.src=URL.createObjectURL(f)}}});
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-sample]");if(!b)return;
  const ds=b.dataset;
  if(ds.sample){const cv=sampleImage(ds.sample);const img=new Image();img.onload=()=>{handleImage(img);toast("已載入示範影像，請輸入刻痕以提高準確度")};img.src=cv.toDataURL();}
  else if(b.id==="camStart"){startCam()}
  else if(b.id==="camShot"){shootCam()}
  else if(b.id==="camStop"){stopCam();$("#camBox").hidden=true;$("#camIdle").hidden=false}
  else if(b.id==="matchGo"){const f={colors:[$("#fc1").value,$("#fc2").value].filter(Boolean),shape:$("#fs").value,form:$("#ff").value,imprint:$("#fi").value};state.scan.feat=f;state.scan.cands=matchDrugs(f);state.selected=null;state.confirmed=false;render();setTimeout(()=>document.querySelector(".cand")?.scrollIntoView({behavior:"smooth",block:"center"}),50)}
  else if(b.id==="bagGo"){const t=$("#bagText").value,bc=$("#barcode").value.trim();let hit=DRUGS.filter(d=>bc&&d.barcode===bc);if(!hit.length&&t)hit=findDrugs(t).concat(DRUGS.filter(d=>t.includes(d.license)||t.toUpperCase().includes(d.nhi)));
    if(!hit.length){toast("藥袋文字或條碼未比對到資料庫中的藥品");return}
    state.scan={feat:{colors:hit[0].color,shape:hit[0].shape,form:hit[0].form,imprint:hit[0].imprint},cands:[...new Set(hit)].map(d=>({d,score:bc&&d.barcode===bc?100:90,why:[bc&&d.barcode===bc?"條碼完全相符":"藥袋文字相符"]})).concat(DRUGS.filter(d=>!hit.includes(d)).slice(0,0)),res:null};state.selected=null;state.confirmed=false;render()}
  else if(ds.pick){state.selected=ds.pick;state.confirmed=false;render();setTimeout(()=>$("#cfOk")?.scrollIntoView({behavior:"smooth",block:"center"}),50)}
  else if(b.id==="cfOk"){const all=[...document.querySelectorAll(".cf")].every(x=>x.checked);if(all||$("#c5").checked){state.confirmed=true;render();setTimeout(()=>document.querySelector(".edu")?.scrollIntoView({behavior:"smooth",block:"start"}),50)}else toast("請完成全部核對項目，或由藥師確認")}
  else if(b.id==="cfNo"){state.confirmed="stop";render()}
  else if(b.id==="restart"){state.scan=null;state.selected=null;state.confirmed=false;render();window.scrollTo(0,0)}
  else if(ds.speak!==undefined){speak(ds.speak,ds.lang||"zh-TW")}
  else if(ds.quiz){const d=byId[ds.quiz];let ok=0,ans=0;d.quiz.forEach((q,qi)=>{const r=document.querySelector(`input[name="q-${d.id}-${qi}"]:checked`);if(r){ans++;if(+r.value===q.a)ok++}});
    const out=$("#qr-"+d.id);if(ans<d.quiz.length){out.textContent="請回答所有題目";return}
    out.innerHTML=ok===d.quiz.length?'<span class="chip ok">全部答對，衛教成效良好</span>':`<span class="chip warn">答對 ${ok}／${d.quiz.length}，請再閱讀相關段落或請教藥師</span>`;state.lastQuiz={id:d.id,pass:ok===d.quiz.length}}
  else if(ds.log){const pid="P-"+String(Math.floor(Math.random()*9000)+1000);const tb=state.lastQuiz&&state.lastQuiz.id===ds.log?state.lastQuiz.pass:null;state.eduLog.push({t:new Date().toLocaleString("zh-TW",{hour12:false}),pid,id:ds.log,tb});save();toast(`已記錄衛教（病人代號 ${pid}）`)}
  else if(ds.addmed){if(state.meds.some(m=>m.example))state.meds=state.meds.filter(m=>!m.example);state.meds.push({id:ds.addmed,dose:"1 顆",times:["08:00"]});save();toast("已加入我的用藥");}
  else if(ds.ask){state.chatDrug=ds.ask;state.chat=state.chat.length?state.chat:[];go("assistant")}
  else if(ds.del!==undefined){state.meds.splice(+ds.del,1);save();render()}
  else if(ds.q){ask(ds.q)}
  else if(b.id==="chatClear"){state.chat=[{r:"a",text:"對話已清除。請輸入藥名與您的問題。",src:"CY團隊 · AI-MedCare"}];state.chatDrug=null;render()}
  else if(b.id==="mic"){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast("此裝置瀏覽器不支援語音輸入，請改用鍵盤或系統語音輸入");return}
    try{const r=new SR();r.lang="zh-TW";r.onresult=ev=>{$("#chatIn").value=ev.results[0][0].transcript};r.onerror=()=>toast("無法使用麥克風");r.start();toast("請開始說話…")}catch(err){toast("無法使用麥克風")}}
  else if(b.id==="n-scan"){const pid=$("#n-pid").value.trim(),bc=$("#n-bc").value.trim(),ord=byId[$("#n-order").value];const d=DRUGS.find(x=>x.barcode===bc);
    let h="";if(!pid)h+=alertHTML({level:"major",title:"缺少病人身分",text:"請先掃描病人手圈並以兩種方式確認身分。"});
    if(!d)h+=alertHTML({level:"major",title:"條碼無法辨識",text:"資料庫找不到此藥品條碼，請勿給藥，聯絡藥局確認。"});
    else if(d.id!==ord.id)h+=alertHTML({level:"major",title:"藥品與醫囑不符",text:`掃描到 ${d.zh} ${d.strength}，醫囑為 ${ord.zh} ${ord.strength}。請停止給藥並重新核對。`});
    else h+=`<div class="alert ok"><span class="sev" style="background:var(--ok)"></span><span class="small">藥品條碼與醫囑相符：${esc(d.zh)} ${esc(d.strength)}</span></div>`;
    if(d&&d.highAlert)h+=alertHTML({level:"major",title:`高警訊藥物：${d.zh}`,text:"給藥前需第二位護理人員獨立雙人核對。"});
    state.nurseOk=!!(pid&&d&&d.id===ord.id);$("#n-res").innerHTML=h;
    $("#n-ha").innerHTML=d&&d.highAlert?`<label class="check"><input type="checkbox" class="n5" id="n-dbl"><span><b>高警訊藥物：已完成雙人獨立核對</b></span></label>`:""}
  else if(b.id==="n-done"){const all=[...document.querySelectorAll(".n5")].every(x=>x.checked);const okScan=!!state.nurseOk;
    $("#n-done-r").innerHTML=all&&okScan?'<div class="alert ok"><span class="sev" style="background:var(--ok)"></span><span class="small">給藥核對完成，可執行給藥並於 eMAR 簽核。</span></div>':alertHTML({level:"moderate",title:"尚未完成核對",text:okScan?"請完成所有三讀五對項目（高警訊藥物含雙人核對）。":"請先完成病人與藥品條碼比對，且結果需相符。"})}
  else if(b.id==="logClear"){state.eduLog=[];save();render()}
});
document.addEventListener("submit",e=>{e.preventDefault();
  if(e.target.id==="chatForm"){const v=$("#chatIn").value.trim();if(v)ask(v)}
  if(e.target.id==="addMed"){if(state.meds.some(m=>m.example))state.meds=state.meds.filter(m=>!m.example);state.meds.push({id:$("#am-id").value,dose:$("#am-dose").value||"1 顆",times:[$("#am-time").value||"08:00"]});save();render();toast("已加入")}
});
function ask(q){state.chat.push({r:"u",text:q});state.chat.push({r:"a",...answer(q)});render();setTimeout(()=>$("#chatIn")?.focus(),0)}

applyPrefs();render();
if("serviceWorker" in navigator && location.protocol.startsWith("http") && document.querySelector('link[rel="manifest"]')){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
